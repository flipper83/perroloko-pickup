<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      padding: 16px;
      text-align: center;
      background: #16213e;
      border-bottom: 3px solid #4CAF50;
    }

    .header h1 { font-size: 1.3em; color: #4CAF50; }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      flex: 1;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .manual-input {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .manual-input input {
      flex: 1;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      font-size: 16px;
    }

    .manual-input input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .manual-input button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .manual-input button:active { background: #388E3C; }

    .result {
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      display: none;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .result.success {
      background: #1b5e20;
      border: 2px solid #4CAF50;
      display: block;
    }

    .result.already {
      background: #e65100;
      border: 2px solid #FF9800;
      display: block;
    }

    .result.not_found {
      background: #b71c1c;
      border: 2px solid #f44336;
      display: block;
    }

    .result .icon { font-size: 48px; margin-bottom: 8px; }
    .result .name { font-size: 1.5em; font-weight: bold; margin: 8px 0; }
    .result .message { font-size: 1em; opacity: 0.9; }

    .result .dismiss {
      margin-top: 16px;
      padding: 10px 24px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .stats {
      text-align: center;
      padding: 12px;
      color: #888;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }

    .loading.active { display: block; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #toggle-camera {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      background: transparent;
      color: #4CAF50;
      font-size: 16px;
      cursor: pointer;
    }

    #toggle-camera:active { background: rgba(76,175,80,0.1); }
  </style>
</head>
<body>
  <div class="header">
    <h1><?= CONFIG.EVENT_NAME ?> - Check-in</h1>
  </div>

  <div class="container">
    <button id="toggle-camera" onclick="toggleCamera()">Iniciar Camara</button>

    <div id="reader"></div>

    <div class="manual-input">
      <input type="text" id="token-input" placeholder="Introducir token manualmente..."
             onkeydown="if(event.key==='Enter') manualCheckin()">
      <button onclick="manualCheckin()">OK</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Procesando check-in...</p>
    </div>

    <div class="result" id="result"></div>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    var scanner = null;
    var cameraActive = false;
    var checkinCount = 0;
    var processing = false;
    var autoToken = '<?= autoToken ?>';

    // Auto-process token from QR URL
    if (autoToken) {
      document.addEventListener('DOMContentLoaded', function() {
        doCheckin(autoToken);
      });
    }

    function toggleCamera() {
      if (cameraActive) {
        stopCamera();
      } else {
        startCamera();
      }
    }

    function startCamera() {
      var btn = document.getElementById('toggle-camera');
      btn.textContent = 'Detener Camara';
      cameraActive = true;

      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        function() {} // ignore scan errors
      ).catch(function(err) {
        btn.textContent = 'Error: ' + err;
        cameraActive = false;
      });
    }

    function stopCamera() {
      var btn = document.getElementById('toggle-camera');
      btn.textContent = 'Iniciar Camara';
      cameraActive = false;

      if (scanner) {
        scanner.stop().catch(function() {});
      }
    }

    function onScanSuccess(decodedText) {
      if (processing) return;

      // Extract token from URL or use raw value
      var token = decodedText;
      try {
        var url = new URL(decodedText);
        var paramToken = url.searchParams.get('token');
        if (paramToken) token = paramToken;
      } catch(e) {
        // Not a URL, use raw value as token
      }

      doCheckin(token);
    }

    function manualCheckin() {
      var input = document.getElementById('token-input');
      var token = input.value.trim();
      if (!token) return;
      input.value = '';
      doCheckin(token);
    }

    function doCheckin(token) {
      if (processing) return;
      processing = true;

      document.getElementById('loading').classList.add('active');
      document.getElementById('result').className = 'result';
      document.getElementById('result').style.display = 'none';

      google.script.run
        .withSuccessHandler(showResult)
        .withFailureHandler(showError)
        .processCheckin(token);
    }

    function showResult(result) {
      processing = false;
      document.getElementById('loading').classList.remove('active');

      var el = document.getElementById('result');
      var icon = '';
      if (result.status === 'success') {
        icon = '&#10004;';
        checkinCount++;
      } else if (result.status === 'already') {
        icon = '&#9888;';
      } else {
        icon = '&#10008;';
      }

      el.className = 'result ' + result.status;
      el.innerHTML =
        '<div class="icon">' + icon + '</div>' +
        (result.name ? '<div class="name">' + escapeHtml(result.name) + '</div>' : '') +
        '<div class="message">' + escapeHtml(result.message) + '</div>' +
        '<button class="dismiss" onclick="dismissResult()">Siguiente</button>';

      document.getElementById('stats').textContent =
        'Check-ins realizados en esta sesion: ' + checkinCount;
    }

    function showError(error) {
      processing = false;
      document.getElementById('loading').classList.remove('active');

      var el = document.getElementById('result');
      el.className = 'result not_found';
      el.innerHTML =
        '<div class="icon">&#10008;</div>' +
        '<div class="message">Error: ' + escapeHtml(error.message) + '</div>' +
        '<button class="dismiss" onclick="dismissResult()">Siguiente</button>';
    }

    function dismissResult() {
      var el = document.getElementById('result');
      el.className = 'result';
      el.style.display = 'none';
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }
  </script>
</body>
</html>
