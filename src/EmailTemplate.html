<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <div style="text-align: center; padding: 20px 0; border-bottom: 3px solid #4CAF50;">
    <h1 style="margin: 0; color: #4CAF50;"><?= eventName ?></h1>
  </div>

  <div style="padding: 20px 0;">
    <p>Hola <strong><?= name ?></strong>,</p>
    <p>Gracias por tu pedido en <strong><?= eventName ?></strong>.</p>
  </div>

  <? if (pickupDay) { ?>
  <div style="padding: 10px 20px; background: #e8f5e9; border-radius: 8px; margin-bottom: 16px;">
    <p style="margin: 0; font-size: 16px;"><strong>Dia de recogida:</strong> <?= pickupDay.charAt(0).toUpperCase() + pickupDay.slice(1) ?></p>
  </div>
  <? } ?>

  <? if (products && products.length > 0) { ?>
  <div style="padding: 16px 20px; background: #f5f5f5; border-radius: 8px; margin-bottom: 16px;">
    <p style="margin: 0 0 8px 0; font-weight: bold; font-size: 16px;">Tu pedido:</p>
    <table style="width: 100%; border-collapse: collapse;">
      <? for (var i = 0; i < products.length; i++) { ?>
        <? if (products[i].qty > 0) { ?>
        <tr>
          <td style="padding: 4px 0; font-size: 15px;"><?= products[i].name ?></td>
          <td style="padding: 4px 0; font-size: 15px; text-align: right; font-weight: bold;">x<?= products[i].qty ?></td>
        </tr>
        <? } ?>
      <? } ?>
    </table>
  </div>
  <? } ?>

  <p>Presenta este codigo QR en el punto de recogida para retirar tu pedido:</p>

  <div style="text-align: center; padding: 20px; background: #f9f9f9; border-radius: 8px;">
    <img src="cid:qrCodeImage" alt="QR Check-in" width="250" height="250"
         style="border: 4px solid #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" />
  </div>

  <div style="padding: 20px 0; font-size: 14px; color: #666;">
    <p>Tu codigo de acceso: <code style="background: #eee; padding: 2px 6px; border-radius: 3px;"><?= token ?></code></p>
    <p>Si no puedes escanear el QR, puedes dar este codigo al personal del evento.</p>
  </div>

  <div style="text-align: center; padding: 15px 0; border-top: 1px solid #eee; font-size: 12px; color: #999;">
    <p>Nos vemos en <?= eventName ?>!</p>
  </div>
</body>
</html>
